name: Check KARABAS Wien

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: karabas-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check KARABAS
        run: python check_karabas.py

      - name: Save changes
        run: |
          git config user.name "karabasW bot"
          git config user.email "actions@github.com"
          git add events.json

          if ! git diff --cached --quiet; then
            git commit -m "Update KARABAS events"
            git fetch origin main
            git reset --soft origin/main
            git commit -m "Update KARABAS events" || true
            git push origin main
          fi
